<!doctype html>
<html lang="zh-CN">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>GraphAgent</title>
    <script>
      // FOUC 防护：React 加载前读 localStorage，预设 data-theme/data-mode + 背景色
      (function() {
        try {
          var raw = localStorage.getItem('ga-theme');
          if (raw) {
            var state = JSON.parse(raw);
            if (state.themeId) document.documentElement.setAttribute('data-theme', state.themeId);
            if (state.mode) document.documentElement.setAttribute('data-mode', state.mode);
            if (state.mode === 'dark') {
              document.documentElement.style.backgroundColor = '#16181d';
            }
          }
        } catch(e) {}
      })();
    </script>
  </head>
  <body>
    <div id="root"></div>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
